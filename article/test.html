<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Article Generator with Image Upload</title>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>

  <body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
      <!-- FORM -->
      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-xl font-semibold mb-4">
          📝 Generate Artikel dengan Gambar
        </h2>

        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">
            Upload Gambar (opsional)
          </label>
          <input
            id="imageInput"
            type="file"
            accept="image/*"
            class="w-full border rounded-lg px-3 py-2 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
          />
          <div id="imagePreview" class="mt-2 hidden">
            <img src="" alt="Preview" class="max-h-40 rounded-lg border" />
          </div>
        </div>

        <button
          onclick="sendToN8n()"
          class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium"
        >
          🚀 Generate & Kirim ke n8n
        </button>
      </div>

      <!-- PREVIEW -->
      <div class="bg-white rounded-2xl shadow p-10">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-xl font-semibold">👀 Preview Artikel</h2>

          <div id="copyButtons" class="hidden space-x-2">
            <button
              onclick="copyMarkdown()"
              class="bg-gray-200 px-3 py-1 rounded-lg text-sm hover:bg-gray-300"
            >
              📋 Copy Markdown
            </button>

            <button
              onclick="copyHTML()"
              class="bg-gray-200 px-3 py-1 rounded-lg text-sm hover:bg-gray-300 hidden"
            >
              📄 Copy HTML
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <article
            id="preview"
            class="prose prose-lg max-w-none prose-h1:text-4xl prose-h1:font-bold prose-h2:text-2xl prose-h2:mt-10 prose-h2:mb-4 prose-p:leading-relaxed prose-p:text-gray-700 prose-strong:text-gray-900 prose-ul:my-4 prose-table:table-auto prose-table:w-full prose-th:bg-gray-100 prose-th:p-3 prose-td:p-3 prose-td:border prose-th:border prose-table:border prose-table:rounded-lg"
          >
            <p class="text-gray-400 italic">Artikel akan muncul di sini…</p>
          </article>
        </div>
      </div>
    </div>

    <script>
      let latestMarkdown = "";
      let latestHTML = "";

      // Preview gambar yang diupload
      document
        .getElementById("imageInput")
        .addEventListener("change", function (e) {
          const file = e.target.files[0];
          const preview = document.getElementById("imagePreview");
          const previewImg = preview.querySelector("img");

          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              previewImg.src = e.target.result;
              preview.classList.remove("hidden");
            };
            reader.readAsDataURL(file);
          } else {
            preview.classList.add("hidden");
            previewImg.src = "";
          }
        });

      async function sendToN8n() {
        const imageFile = document.getElementById("imageInput").files[0];

        // Buat FormData untuk mengirim file
        const formData = new FormData();

        // Tambahkan file gambar jika ada
        if (imageFile) {
          formData.append("image", imageFile);
        }

        const preview = document.getElementById("preview");
        preview.innerHTML =
          '<p class="italic text-gray-400">⏳ Generating artikel...</p>';

        document.getElementById("copyButtons").classList.add("hidden");

        try {
          const primaryUrl =
            "https://wa.togu.co.id/webhook/5b334912-8383-481d-b4b6-3da4162503ba";
          const fallbackUrl =
            "http://192.168.1.96:5678/webhook-test/5b334912-8383-481d-b4b6-3da4162503ba";

          let res;

          // 🔹 1️⃣ Coba domain dulu
          try {
            res = await fetch(primaryUrl, {
              method: "POST",
              body: formData,
              // Tidak perlu set Content-Type karena FormData akan mengatur boundary secara otomatis
            });

            if (!res.ok) {
              throw new Error("Primary endpoint gagal");
            }
          } catch (primaryError) {
            console.warn("Primary gagal, mencoba fallback IP...");

            // 🔹 2️⃣ Jika gagal, pakai IP
            res = await fetch(fallbackUrl, {
              method: "POST",
              body: formData,
            });

            if (!res.ok) {
              throw new Error("Fallback endpoint juga gagal");
            }
          }

          const data = await res.json();
          console.log(data);

          const output = data.markdown;

          latestMarkdown = output;
          latestHTML = marked.parse(output);

          preview.innerHTML = latestHTML;

          document.getElementById("copyButtons").classList.remove("hidden");
        } catch (err) {
          preview.innerHTML = '<p class="text-red-600">❌ Server error</p>';
          console.error(err);
        }
      }

      function copyMarkdown() {
        navigator.clipboard.writeText(latestMarkdown);
        alert("✅ Markdown berhasil dicopy!");
      }

      function copyHTML() {
        navigator.clipboard.writeText(latestHTML);
        alert("✅ HTML berhasil dicopy!");
      }
    </script>
  </body>
</html>
