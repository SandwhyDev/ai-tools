<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Article Generator</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logo2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logo2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo2.png" />

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>

  <body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
      <!-- FORM -->
      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-xl font-semibold mb-4">📝 Generate Artikel</h2>

        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Topik Artikel</label>
          <input
            id="topicInput"
            type="text"
            placeholder="Contoh: ERP di perusahaan manufaktur"
            class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Jumlah Kata</label>
          <input
            id="wordCountInput"
            type="number"
            value="800"
            class="w-full border rounded-lg px-3 py-2"
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">
            Catatan Tambahan (opsional)
          </label>
          <textarea
            id="notesInput"
            rows="3"
            placeholder="Tidak ada"
            class="w-full border rounded-lg px-3 py-2"
          ></textarea>
        </div>

        <button
          onclick="sendToN8n()"
          class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium"
        >
          🚀 Generate & Kirim ke n8n
        </button>
      </div>

      <!-- PREVIEW -->
      <div class="bg-white rounded-2xl shadow p-10">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-xl font-semibold">👀 Preview Artikel</h2>

          <div id="copyButtons" class="hidden space-x-2">
            <button
              onclick="copyMarkdown()"
              class="bg-gray-200 px-3 py-1 rounded-lg text-sm hover:bg-gray-300"
            >
              📋 Copy Markdown
            </button>

            <button
              onclick="copyHTML()"
              class="bg-gray-200 px-3 py-1 rounded-lg text-sm hover:bg-gray-300 hidden"
            >
              📄 Copy HTML
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <article
            id="preview"
            class="prose prose-lg max-w-none prose-h1:text-4xl prose-h1:font-bold prose-h2:text-2xl prose-h2:mt-10 prose-h2:mb-4 prose-p:leading-relaxed prose-p:text-gray-700 prose-strong:text-gray-900 prose-ul:my-4 prose-table:table-auto prose-table:w-full prose-th:bg-gray-100 prose-th:p-3 prose-td:p-3 prose-td:border prose-th:border prose-table:border prose-table:rounded-lg"
          >
            <p class="text-gray-400 italic">Artikel akan muncul di sini…</p>
          </article>
        </div>
      </div>
    </div>

    <script>
      let latestMarkdown = "";
      let latestHTML = "";

      async function sendToN8n() {
        const topic = document.getElementById("topicInput").value.trim();
        const wordCount =
          document.getElementById("wordCountInput").value || 800;
        let notes = document.getElementById("notesInput").value.trim();

        if (!topic) {
          alert("Topik wajib diisi");
          return;
        }

        if (!notes) notes = "Tidak ada";

        const payload = {
          topic,
          word_count: Number(wordCount),
          additional_notes: notes,
        };

        const preview = document.getElementById("preview");
        preview.innerHTML =
          '<p class="italic text-gray-400">⏳ Generating artikel...</p>';

        document.getElementById("copyButtons").classList.add("hidden");

        try {
          const primaryUrl =
            "https://wa.togu.co.id/webhook/60e19351-16ce-4d55-976d-b537b553face";

          const fallbackUrl =
            "http://192.168.1.96:5678/webhook/60e19351-16ce-4d55-976d-b537b553face";

          let res;

          // 🔹 1️⃣ Coba domain dulu
          try {
            res = await fetch(primaryUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            if (!res.ok) {
              throw new Error("Primary endpoint gagal");
            }
          } catch (primaryError) {
            console.warn("Primary gagal, mencoba fallback IP...");

            // 🔹 2️⃣ Jika gagal, pakai IP
            res = await fetch(fallbackUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            });

            if (!res.ok) {
              throw new Error("Fallback endpoint juga gagal");
            }
          }

          const data = await res.json();
          const output = data.output;

          latestMarkdown = output.content;
          latestHTML = marked.parse(output.content);

          preview.innerHTML = latestHTML;

          document.getElementById("copyButtons").classList.remove("hidden");
        } catch (err) {
          preview.innerHTML = '<p class="text-red-600">❌ Server error</p>';
          console.error(err);
        }
      }

      function copyMarkdown() {
        navigator.clipboard.writeText(latestMarkdown);
        alert("✅ Markdown berhasil dicopy!");
      }

      function copyHTML() {
        navigator.clipboard.writeText(latestHTML);
        alert("✅ HTML berhasil dicopy!");
      }
    </script>
  </body>
</html>
