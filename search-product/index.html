<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Search - Table View (n8n Integration)</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logo2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logo2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/logo2.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      .loading {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .table-container {
        overflow-x: auto;
        scrollbar-width: thin;
        scrollbar-color: #cbd5e0 #f1f5f9;
      }
      .table-container::-webkit-scrollbar {
        height: 8px;
      }
      .table-container::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
      }
      .table-container::-webkit-scrollbar-thumb {
        background: #cbd5e0;
        border-radius: 4px;
      }
      .table-container::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .product-row {
        transition: all 0.2s;
      }
      .product-row:hover {
        background-color: #f8fafc;
      }
      .product-image {
        transition: transform 0.2s;
      }
      .product-image:hover {
        transform: scale(1.5);
        cursor: pointer;
      }
      .filter-active {
        background-color: #3b82f6 !important;
        color: white !important;
      }

      /* Tab Styles */
      .tab-btn {
        position: relative;
        padding: 12px 24px;
        font-weight: 600;
        font-size: 0.875rem;
        color: #64748b;
        border-bottom: 3px solid transparent;
        transition: all 0.2s;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        background: none;
        border-top: none;
        border-left: none;
        border-right: none;
        outline: none;
        white-space: nowrap;
      }
      .tab-btn:hover {
        color: #3b82f6;
      }
      .tab-btn.active {
        color: #3b82f6;
        border-bottom-color: #3b82f6;
      }
      .tab-badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 9999px;
        background: #e2e8f0;
        color: #475569;
        transition: all 0.2s;
      }
      .tab-btn.active .tab-badge {
        background: #dbeafe;
        color: #2563eb;
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
      <!-- Header -->
      <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">
          <span
            class="bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600"
          >
            Product Search
          </span>
        </h1>
      </header>

      <!-- Search Section -->
      <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
        <div class="flex flex-col md:flex-row gap-4">
          <div class="flex-1">
            <label
              for="searchInput"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Product Keyword
            </label>
            <input
              type="text"
              id="searchInput"
              class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
              placeholder="Enter product keyword"
              autofocus
            />
          </div>
          <div class="flex items-end gap-2">
            <button
              onclick="searchProducts()"
              class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-8 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            >
              <span class="flex items-center justify-center gap-2">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                    clip-rule="evenodd"
                  />
                </svg>
                Search
              </span>
            </button>
            <button
              onclick="resetSearch()"
              class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 px-6 rounded-lg transition duration-300"
            >
              Reset
            </button>
          </div>
        </div>

        <!-- Filter Section -->
        <div
          id="filterSection"
          class="hidden mt-6 pt-4 border-t border-slate-200"
        >
          <div class="flex flex-wrap items-center gap-4">
            <span class="text-sm font-semibold text-slate-700"
              >Filter Harga:</span
            >
            <div id="priceRangeInfo" class="flex items-center gap-3 text-sm">
              <span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full">
                Min: <span id="minPriceDisplay">Rp 0</span>
              </span>
              <span class="bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full">
                Max: <span id="maxPriceDisplay">Rp 0</span>
              </span>
            </div>
            <div class="flex items-center gap-2 ml-auto">
              <span class="text-sm text-slate-600">Urutkan:</span>
              <button
                id="filterTermurah"
                onclick="applyPriceFilter('termurah')"
                class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z"
                    clip-rule="evenodd"
                  />
                </svg>
                Termurah
              </button>
              <button
                id="filterTermahal"
                onclick="applyPriceFilter('termahal')"
                class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
                    clip-rule="evenodd"
                  />
                </svg>
                Termahal
              </button>
              <button
                id="resetFilter"
                onclick="resetPriceFilter()"
                class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-1.5 rounded-lg text-sm font-medium transition ml-2"
              >
                Reset Filter
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div id="loading" class="hidden text-center py-12">
        <div
          class="inline-flex items-center gap-3 bg-white rounded-lg px-6 py-4 shadow-md"
        >
          <div
            class="loading w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full"
          ></div>
          <span class="text-slate-700 font-medium">Searching products</span>
        </div>
      </div>

      <!-- Error Message -->
      <div
        id="errorMessage"
        class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6"
      >
        <div class="flex items-center gap-2">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
          <span id="errorText"></span>
        </div>
      </div>

      <!-- Results Section with Tabs -->
      <div id="resultsContainer" class="hidden">
        <!-- Summary Stats -->
        <div
          class="bg-white rounded-lg shadow-md p-4 mb-4 flex flex-wrap items-center gap-4"
        >
          <div class="flex items-center gap-2">
            <span class="font-semibold text-slate-800">Keyword:</span>
            <span
              id="searchKeyword"
              class="bg-slate-100 text-slate-800 px-3 py-1 rounded-full text-sm"
            ></span>
          </div>
          <div id="activeFilterIndicator" class="hidden items-center gap-2">
            <span class="font-semibold text-slate-800">Filter:</span>
            <span
              id="activeFilterText"
              class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm"
            ></span>
          </div>
        </div>

        <!-- Tab Container -->
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
          <!-- Tab Header -->
          <div class="border-b border-slate-200 bg-slate-50 px-2">
            <div class="flex items-center overflow-x-auto">
              <!-- Tab: Products -->
              <button
                class="tab-btn active"
                id="tab-products"
                onclick="switchTab('products')"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"
                  />
                </svg>
                Products
                <span class="tab-badge" id="badge-products">0</span>
              </button>

              <!-- Tab: Companies -->
              <button
                class="tab-btn"
                id="tab-companies"
                onclick="switchTab('companies')"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                >
                  <path
                    fill-rule="evenodd"
                    d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm3 1h2v2H7V5zm2 4H7v2h2V9zm2-4h2v2h-2V5zm2 4h-2v2h2V9z"
                    clip-rule="evenodd"
                  />
                </svg>
                Principal / Distributor
                <span class="tab-badge" id="badge-companies">0</span>
              </button>
            </div>
          </div>

          <!-- Tab Panel: Products -->
          <div class="tab-panel active" id="panel-products">
            <!-- Export bar inside tab -->
            <div
              class="flex items-center justify-between px-4 py-3 border-b border-slate-100 bg-slate-50"
            >
              <span class="text-sm text-slate-500">
                Showing
                <span id="resultCount" class="font-semibold text-slate-700"
                  >0</span
                >
                products
              </span>
              <div class="flex gap-2">
                <button
                  onclick="exportToCSV()"
                  class="bg-green-50 hover:bg-green-100 text-green-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-3.5 w-3.5"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  Export CSV
                </button>
                <button
                  onclick="copyToClipboard()"
                  class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-3.5 w-3.5"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                  >
                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                    <path
                      d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z"
                    />
                  </svg>
                  Copy Table
                </button>
              </div>
            </div>

            <div class="table-container">
              <table class="min-w-full divide-y divide-slate-200">
                <thead class="bg-gradient-to-r from-slate-50 to-slate-100">
                  <tr>
                    <th
                      scope="col"
                      class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider w-20"
                    >
                      Image
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider"
                    >
                      Product Name
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider w-32"
                    >
                      Price
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider w-40"
                    >
                      Source
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-4 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider w-28"
                    >
                      Action
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="productTableBody"
                  class="bg-white divide-y divide-slate-200"
                ></tbody>
              </table>
            </div>
          </div>

          <!-- Tab Panel: Companies -->
          <div class="tab-panel" id="panel-companies">
            <div class="p-6">
              <div id="companyList" class="space-y-3"></div>
              <div id="companyEmpty" class="hidden text-center py-12">
                <div class="bg-slate-50 rounded-xl p-8 max-w-sm mx-auto">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-10 w-10 text-slate-300 mx-auto mb-3"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                    />
                  </svg>
                  <p class="text-slate-500 text-sm">
                    No company data available
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- end tab container -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-16">
        <div class="bg-white rounded-xl p-12 shadow-sm max-w-md mx-auto">
          <div
            class="bg-slate-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-6"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-10 w-10 text-slate-400"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
          </div>
          <h3 class="text-xl font-semibold text-slate-800 mb-2">
            No products found
          </h3>
          <p class="text-slate-600 mb-6">
            Try adjusting your search keyword or use one of the quick filters
            above
          </p>
          <button
            onclick="document.getElementById('searchInput').focus()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition"
          >
            Start New Search
          </button>
        </div>
      </div>
    </div>

    <!-- Image Modal -->
    <div
      id="imageModal"
      class="hidden fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4"
      onclick="closeModal()"
    >
      <div class="relative max-w-3xl max-h-[90vh]">
        <button
          onclick="closeModal()"
          class="absolute -top-10 right-0 text-white hover:text-slate-300"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
        <img
          id="modalImage"
          src=""
          alt="Product"
          class="max-w-full max-h-[90vh] object-contain rounded-lg"
        />
      </div>
    </div>

    <script>
      let currentProducts = [];
      let filteredProducts = [];
      let activeFilter = null;

      // ── Tab switching ─────────────────────────────────────────
      function switchTab(name) {
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        document
          .querySelectorAll(".tab-panel")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById("tab-" + name).classList.add("active");
        document.getElementById("panel-" + name).classList.add("active");

        // Show/hide filter section only on products tab
        const fs = document.getElementById("filterSection");
        if (name === "products") {
          if (currentProducts.length > 0) fs.classList.remove("hidden");
        } else {
          fs.classList.add("hidden");
        }
      }

      // ── Price helpers ────────────────────────────────────────
      function parsePrice(priceString) {
        if (!priceString) return 0;
        return parseInt(priceString.replace(/[^\d]/g, ""), 10) || 0;
      }

      function formatPrice(n) {
        return `Rp ${n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".")}`;
      }

      function updatePriceRangeInfo(products) {
        if (!products || products.length === 0) return;
        const prices = products.map((p) => parsePrice(p.harga));
        document.getElementById("minPriceDisplay").textContent = formatPrice(
          Math.min(...prices),
        );
        document.getElementById("maxPriceDisplay").textContent = formatPrice(
          Math.max(...prices),
        );
      }

      function applyPriceFilter(type) {
        if (!currentProducts || currentProducts.length === 0) {
          showError("No products to filter");
          return;
        }
        activeFilter = type;

        document
          .getElementById("filterTermurah")
          .classList.remove("filter-active", "bg-blue-600", "text-white");
        document
          .getElementById("filterTermahal")
          .classList.remove("filter-active", "bg-blue-600", "text-white");

        if (type === "termurah") {
          document
            .getElementById("filterTermurah")
            .classList.add("filter-active", "bg-blue-600", "text-white");
          document.getElementById("activeFilterText").textContent = "Termurah";
        } else {
          document
            .getElementById("filterTermahal")
            .classList.add("filter-active", "bg-blue-600", "text-white");
          document.getElementById("activeFilterText").textContent = "Termahal";
        }

        filteredProducts = [...currentProducts].sort((a, b) => {
          const pa = parsePrice(a.harga),
            pb = parsePrice(b.harga);
          return type === "termurah" ? pa - pb : pb - pa;
        });

        displayProductRows(filteredProducts);
        document
          .getElementById("activeFilterIndicator")
          .classList.remove("hidden");
        document.getElementById("activeFilterIndicator").classList.add("flex");
      }

      function resetPriceFilter() {
        activeFilter = null;
        filteredProducts = [...currentProducts];
        document
          .getElementById("filterTermurah")
          .classList.remove("filter-active", "bg-blue-600", "text-white");
        document
          .getElementById("filterTermahal")
          .classList.remove("filter-active", "bg-blue-600", "text-white");
        document
          .getElementById("activeFilterIndicator")
          .classList.add("hidden");
        document
          .getElementById("activeFilterIndicator")
          .classList.remove("flex");
        displayProductRows(currentProducts);
      }

      function displayProductRows(products) {
        const tableBody = document.getElementById("productTableBody");
        tableBody.innerHTML = "";
        products.forEach((product, index) =>
          tableBody.appendChild(createTableRow(product, index)),
        );
        document.getElementById("resultCount").textContent =
          `${products.length} products`;
        document.getElementById("badge-products").textContent = products.length;
      }

      // ── Search ───────────────────────────────────────────────
      async function searchProducts() {
        const keyword = document.getElementById("searchInput").value.trim();
        if (!keyword) {
          showError("Please enter a product keyword");
          return;
        }

        document.getElementById("searchKeyword").textContent = keyword;
        document.getElementById("loading").classList.remove("hidden");
        document.getElementById("resultsContainer").classList.add("hidden");
        document.getElementById("emptyState").classList.add("hidden");
        document.getElementById("errorMessage").classList.add("hidden");
        document.getElementById("filterSection").classList.add("hidden");

        resetPriceFilter();

        try {
          const WEBHOOK_URLS = [
            "https://wa.togu.co.id/webhook/40232f3c-2c98-43ef-b0c0-feaf28146c00",
            "http://192.168.1.96:5678/webhook/40232f3c-2c98-43ef-b0c0-feaf28146c00",
          ];

          let response = null;
          for (const url of WEBHOOK_URLS) {
            try {
              console.log("Trying:", url);
              response = await axios.post(
                url,
                { keyword },
                { headers: { "Content-Type": "application/json" } },
              );
              break;
            } catch (err) {
              console.warn("Failed:", url);
            }
          }

          if (!response || !response.data) {
            showError("All webhook endpoints failed");
            document.getElementById("loading").classList.add("hidden");
            return;
          }

          if (response?.data?.[0]?.success) {
            document.getElementById("loading").classList.add("hidden");
            displayProducts(response.data[0], keyword);
            displayCompanies(response.data?.[1]?.perusahaan || []);
          } else {
            showError("Invalid response format from server");
            document.getElementById("loading").classList.add("hidden");
          }
        } catch (error) {
          console.error("Error:", error);
          showError(
            error.response
              ? `Server error: ${error.response.status} - ${error.response.statusText}`
              : "Server error",
          );
          document.getElementById("loading").classList.add("hidden");
        }
      }

      function displayProducts(response, keyword) {
        currentProducts = response.data || [];
        filteredProducts = [...currentProducts];

        if (!currentProducts || currentProducts.length === 0) {
          document.getElementById("resultsContainer").classList.add("hidden");
          document.getElementById("emptyState").classList.remove("hidden");
          return;
        }

        updatePriceRangeInfo(currentProducts);
        document.getElementById("filterSection").classList.remove("hidden");
        displayProductRows(currentProducts);
        document.getElementById("resultsContainer").classList.remove("hidden");
        document.getElementById("emptyState").classList.add("hidden");

        // Switch to products tab when new results come in
        switchTab("products");
      }

      function displayCompanies(companies) {
        const list = document.getElementById("companyList");
        const empty = document.getElementById("companyEmpty");
        list.innerHTML = "";

        const count = companies ? companies.length : 0;
        document.getElementById("badge-companies").textContent = count;
        document.getElementById("companyCount") &&
          (document.getElementById("companyCount").textContent = count);

        if (!companies || companies.length === 0) {
          list.classList.add("hidden");
          empty.classList.remove("hidden");
          return;
        }

        list.classList.remove("hidden");
        empty.classList.add("hidden");

        companies.forEach((company) => {
          const div = document.createElement("div");
          div.className =
            "border border-slate-200 rounded-lg p-4 flex items-center justify-between hover:bg-slate-50 transition";
          div.innerHTML = `
            <div class="flex items-center gap-3">
              <img src="${company.icon || "https://via.placeholder.com/40"}" class="w-12 h-12 rounded-lg object-contain border border-slate-200 bg-white p-1" onerror="this.src='https://via.placeholder.com/40'"/>
              <div class="flex flex-col">
                <div class="font-semibold text-slate-800">${company.company_name}</div>
                <div class="text-sm text-slate-500 truncate max-w-sm" title="${company.website}">${company.website}</div>
              </div>
            </div>
            <a href="${company.website}" target="_blank" class="flex items-center gap-1.5 text-blue-600 text-sm font-medium hover:underline ml-4 shrink-0">
              Visit
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
                <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/>
              </svg>
            </a>
          `;
          list.appendChild(div);
        });
      }

      function createTableRow(product, index) {
        const row = document.createElement("tr");
        row.className = "product-row hover:bg-slate-50";

        const imageUrl =
          product.image || "https://via.placeholder.com/60x60?text=No+Image";
        const sanitizedLink = product.link.replace(/"/g, "&quot;");

        row.innerHTML = `
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="relative group">
              <img src="${imageUrl}" alt="${product.item.replace(/"/g, "&quot;")}" class="product-image w-12 h-12 object-cover rounded-lg shadow-sm border border-slate-200 cursor-pointer" onclick="openImageModal('${imageUrl.replace(/'/g, "\\'")}')" onerror="this.src='https://via.placeholder.com/60x60?text=No+Image'">
              <span class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap">Click to enlarge</span>
            </div>
          </td>
          <td class="px-6 py-4">
            <div class="text-sm font-medium text-slate-900 max-w-md">${product.item.replace(/"/g, "&quot;")}</div>
            <div class="text-xs text-slate-500 mt-1 truncate max-w-md">${product.link.replace(/"/g, "&quot;")}</div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="text-sm font-bold text-green-700 bg-green-50 px-3 py-1.5 rounded-full">${product.harga}</span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="text-sm text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full truncate max-w-[150px] inline-block">${product.source.replace(/"/g, "&quot;")}</span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="flex items-center gap-2">
              <a href="${sanitizedLink}" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
                  <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/>
                </svg>
                Visit
              </a>
              <button onclick='copyProductLink("${sanitizedLink}")' class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-1.5 rounded-lg transition" title="Copy link">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z"/>
                  <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z"/>
                </svg>
              </button>
            </div>
          </td>
        `;
        return row;
      }

      function resetSearch() {
        document.getElementById("searchInput").value = "";
        document.getElementById("resultsContainer").classList.add("hidden");
        document.getElementById("emptyState").classList.remove("hidden");
        document.getElementById("errorMessage").classList.add("hidden");
        document.getElementById("filterSection").classList.add("hidden");
        currentProducts = [];
        filteredProducts = [];
        activeFilter = null;
      }

      function openImageModal(imageUrl) {
        document.getElementById("modalImage").src = imageUrl;
        document.getElementById("imageModal").classList.remove("hidden");
      }

      function closeModal() {
        document.getElementById("imageModal").classList.add("hidden");
      }

      function copyProductLink(link) {
        navigator.clipboard
          .writeText(link)
          .then(() => showNotification("Link copied to clipboard!"))
          .catch(() => alert("Failed to copy link"));
      }

      function exportToCSV() {
        const products =
          filteredProducts.length > 0 ? filteredProducts : currentProducts;
        if (products.length === 0) {
          showError("No data to export");
          return;
        }
        let csv = "Product Name,Price,Source,Link\n";
        products.forEach((p) => {
          csv += `"${p.item.replace(/"/g, '""')}","${p.harga.replace(/"/g, '""')}","${p.source.replace(/"/g, '""')}","${p.link.replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `product_search_${Date.now()}.csv`;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showNotification("CSV file downloaded!");
      }

      function copyToClipboard() {
        const products =
          filteredProducts.length > 0 ? filteredProducts : currentProducts;
        if (products.length === 0) {
          showError("No data to copy");
          return;
        }
        let text = "Product Name\tPrice\tSource\tLink\n";
        products.forEach((p) => {
          text += `${p.item}\t${p.harga}\t${p.source}\t${p.link}\n`;
        });
        navigator.clipboard
          .writeText(text)
          .then(() => showNotification("Table copied to clipboard!"))
          .catch(() => alert("Failed to copy table"));
      }

      function showNotification(message) {
        const el = document.createElement("div");
        el.className =
          "fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50";
        el.textContent = message;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }

      function showError(message) {
        const em = document.getElementById("errorMessage");
        document.getElementById("errorText").textContent = message;
        em.classList.remove("hidden");
        setTimeout(() => em.classList.add("hidden"), 5000);
      }

      document
        .getElementById("searchInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") searchProducts();
        });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
    </script>
  </body>
</html>
