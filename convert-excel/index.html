<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image to Excel Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .loading {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .table-container {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
      }
      .category-row {
        background-color: #dbeafe;
        font-weight: bold;
      }
      .subtotal-row {
        background-color: #fef3c7;
        font-weight: 600;
      }
      .grand-total-row {
        background-color: #dcfce7;
        font-weight: bold;
        font-size: 1.1rem;
      }
      .detail-row:hover {
        background-color: #f9fafb;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen py-8">
    <div class="container mx-auto px-4 max-w-6xl">
      <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
        <div class="flex w-full justify-between items-center mb-6">
          <div class="">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">
              Image to Excel Converter
            </h1>
          </div>

          <div
            id="startOver"
            class="w-10 h-10 flex justify-end text-2xl hover:cursor-pointer hidden"
          >
            🔁
          </div>
        </div>

        <!-- Upload Area -->
        <div
          id="uploadArea"
          class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-6 hover:border-blue-500 transition-colors"
        >
          <input type="file" id="imageInput" accept="image/*" class="hidden" />
          <label for="imageInput" class="cursor-pointer">
            <svg
              class="mx-auto h-12 w-12 text-gray-400 mb-4"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
              ></path>
            </svg>
            <p class="text-gray-600 font-medium mb-2">
              Klik untuk upload gambar
            </p>
            <p class="text-gray-400 text-sm">PNG, JPG, JPEG (Maks. 10MB)</p>
          </label>
        </div>

        <!-- Preview Image -->
        <div id="imagePreview" class="hidden mb-6 flex justify-center">
          <!-- <h3 class="text-lg font-semibold text-gray-700 mb-3">
            Preview Gambar:
          </h3> -->
          <img
            id="previewImg"
            class="max-w-full h-auto rounded-lg border border-gray-300"
          />
        </div>

        <!-- Convert Button -->
        <button
          id="convertBtn"
          class="hidden w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          <span id="btnText">Konversi ke Excel</span>
          <div id="btnLoader" class="loading mx-auto hidden"></div>
        </button>
      </div>

      <!-- Results Table -->
      <div
        id="resultsContainer"
        class="hidden bg-white rounded-lg shadow-lg p-6"
      >
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-2xl font-bold text-gray-800">Hasil Konversi</h2>
          <button
            id="copyBtn"
            class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
          >
            📋 Copy ke Excel
          </button>
        </div>

        <div id="notification" class="hidden my-4 p-4 rounded-lg"></div>

        <div class="table-container">
          <table id="dataTable" class="w-full border border-gray-300">
            <thead>
              <tr class="bg-gray-100">
                <th
                  class="border border-gray-300 px-4 py-2 text-left font-semibold text-gray-700"
                >
                  Item Pekerjaan
                </th>
                <th
                  class="border border-gray-300 px-4 py-2 text-left font-semibold text-gray-700"
                >
                  Volume
                </th>
                <th
                  class="border border-gray-300 px-4 py-2 text-right font-semibold text-gray-700"
                >
                  Harga Satuan (Rp)
                </th>
                <th
                  class="border border-gray-300 px-4 py-2 text-right font-semibold text-gray-700"
                >
                  Total (Rp)
                </th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <!-- Data will be inserted here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
